services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minigame
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: minigame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame -d minigame"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://minigame:minigame@db:5432/minigame
      ADMIN_USER: ${ADMIN_USER:-admid}
      ADMIN_PASS: ${ADMIN_PASS:-bantudethuong}
    ports:
      - "3000:3000"

volumes:
  pgdata:
