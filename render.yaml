services:
  - type: web
    name: minigame
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        fromDatabase:
          name: minigame-db
          property: connectionString
      - key: ADMIN_USER
        value: admid
      - key: ADMIN_PASS
        sync: false

databases:
  - name: minigame-db
    plan: free
    databaseName: minigame
    user: minigame
    ipAllowList: []
